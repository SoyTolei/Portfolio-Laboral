<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Leonel Gallo — Resume</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        :root { --accent: #c45c26; --ink: #1a1a1a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .cv-bar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: var(--ink);
            color: #f5f5f5;
            font-size: 13px;
        }
        .cv-bar a { color: #f5f5f5; text-decoration: none; font-weight: 500; }
        .cv-bar a:hover { color: var(--accent); }
        .cv-bar__download {
            display: inline-flex;
            align-items: center;
            padding: 8px 14px;
            border: 1.5px solid #f5f5f5;
            border-radius: 6px;
            font-weight: 600;
        }
        .cv-bar__download:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .cv-frame {
            flex: 1;
            width: 100%;
            border: 0;
            min-height: calc(100vh - 52px);
            background: #222;
        }
        @media print {
            .cv-bar { display: none !important; }
            .cv-frame { min-height: 100vh; }
        }
    </style>
</head>
<body>
    <div class="cv-bar">
        <a href="index.html">← Portfolio</a>
        <a class="cv-bar__download" href="assets/cv/leonel-gallo-2026-en.pdf" download="Leonel-Gallo-CV-EN.pdf">Download PDF</a>
    </div>
    <iframe class="cv-frame" src="assets/cv/leonel-gallo-2026-en.pdf#toolbar=1" title="Leonel Gallo Resume"></iframe>
</body>
</html>
