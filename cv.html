<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV — Leonel Gallo | Tolei</title>
    <meta name="description" content="Curriculum de Leonel Gallo (Tolei). Soporte técnico, SQL Server y .NET.">
    <link rel="canonical" href="https://tolei.dev/cv.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0e0e0c">
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            var theme = localStorage.getItem('tolei-portfolio-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body class="cv-page">
    <header class="cv-top">
        <div class="wrap cv-top-inner">
            <a href="index.html" class="brand">
                <span class="brand-mark">tolei</span>
                <span class="brand-sub">cv</span>
            </a>
            <a href="index.html" class="btn btn-ghost" data-cv-back>← Volver al portfolio</a>
        </div>
    </header>

    <main class="cv-main">
        <div class="wrap">
            <header class="cv-head">
                <div class="cv-head-top">
                    <p class="block-eyebrow" data-cv-eyebrow>// curriculum</p>
                    <div class="cv-head-actions">
                        <div class="cv-lang" role="group" aria-label="Idioma del CV">
                            <button type="button" class="cv-lang-btn is-active" data-cv-lang="es" aria-pressed="true">ES</button>
                            <button type="button" class="cv-lang-btn" data-cv-lang="en" aria-pressed="false">EN</button>
                        </div>
                        <a class="btn btn-primary cv-download" href="#" download data-cv-download>
                            <span class="cv-download-icon" aria-hidden="true">↓</span>
                            <span data-cv-download-label>Descargar CV</span>
                        </a>
                    </div>
                </div>
                <h1 class="cv-title">Leonel Gallo</h1>
                <p class="cv-lead" data-cv-lead>Analista de soporte técnico · SQL Server · .NET</p>
            </header>

            <div class="cv-stage" aria-busy="true">
                <div class="cv-loading" data-cv-loading>Cargando CV…</div>
                <div class="cv-pages" id="cv-pages" hidden></div>
            </div>

            <p class="cv-fallback" data-cv-fallback hidden>
                <span data-cv-fallback-text>No se pudo mostrar el preview.</span>
                <a href="#" data-cv-open target="_blank" rel="noopener">Abrí el PDF</a>
                <span data-cv-fallback-or> o descargalo con el botón de arriba.</span>
            </p>
        </div>
    </main>

    <script type="module">
        const PDFJS_VER = '4.10.38';
        const PDFJS_BASE = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VER}`;

        const COPY = {
            es: {
                title: 'CV — Leonel Gallo | Tolei',
                eyebrow: '// curriculum',
                lead: 'Analista de soporte técnico · SQL Server · .NET',
                download: 'Descargar CV',
                loading: 'Cargando CV…',
                fallback: 'No se pudo mostrar el preview.',
                open: 'Abrí el PDF',
                fallbackOr: ' o descargalo con el botón de arriba.',
                back: '← Volver al portfolio',
                lang: 'es',
                downloadName: {
                    light: 'Leonel-Gallo-CV.pdf',
                    dark: 'Leonel-Gallo-CV-Dark.pdf'
                },
                pdf: {
                    light: 'assets/cv/leonel-gallo-2026.pdf',
                    dark: 'assets/cv/Leonel_Gallo_CV_Dark.pdf'
                }
            },
            en: {
                title: 'Resume — Leonel Gallo | Tolei',
                eyebrow: '// resume',
                lead: 'Technical support analyst · SQL Server · .NET',
                download: 'Download CV',
                loading: 'Loading resume…',
                fallback: 'Could not show the preview.',
                open: 'Open the PDF',
                fallbackOr: ' or use the download button above.',
                back: '← Back to portfolio',
                lang: 'en',
                downloadName: {
                    light: 'Leonel-Gallo-CV-EN.pdf',
                    dark: 'Leonel-Gallo-CV-EN-Dark.pdf'
                },
                pdf: {
                    light: 'assets/cv/leonel-gallo-2026-en.pdf',
                    dark: 'assets/cv/Leonel_Gallo_CV_EN_Dark.pdf'
                }
            }
        };

        const THEME_KEY = 'tolei-portfolio-theme';
        const params = new URLSearchParams(location.search);
        let currentLang = (params.get('lang') === 'en' || location.pathname.includes('cv-en')) ? 'en' : 'es';
        let renderToken = 0;
        let pdfjsLib = null;

        const pagesEl = document.getElementById('cv-pages');
        const stageEl = document.querySelector('.cv-stage');
        const loadingEl = document.querySelector('[data-cv-loading]');
        const fallbackEl = document.querySelector('[data-cv-fallback]');
        const downloadEl = document.querySelector('[data-cv-download]');
        const downloadLabel = document.querySelector('[data-cv-download-label]');
        const openEl = document.querySelector('[data-cv-open]');
        const backEl = document.querySelector('[data-cv-back]');

        function getTheme() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        }

        function syncThemeMeta() {
            const theme = getTheme();
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e0e0c' : '#f6f5f2');
        }

        function currentPdf() {
            const t = COPY[currentLang];
            const theme = getTheme();
            return {
                url: t.pdf[theme],
                downloadName: t.downloadName[theme],
                theme
            };
        }

        function setUi() {
            const t = COPY[currentLang];
            const file = currentPdf();
            document.documentElement.lang = t.lang;
            document.title = t.title;
            document.querySelector('[data-cv-eyebrow]').textContent = t.eyebrow;
            document.querySelector('[data-cv-lead]').textContent = t.lead;
            downloadLabel.textContent = t.download;
            downloadEl.setAttribute('href', file.url);
            downloadEl.setAttribute('download', file.downloadName);
            openEl.setAttribute('href', file.url);
            openEl.textContent = t.open;
            document.querySelector('[data-cv-fallback-text]').textContent = t.fallback;
            document.querySelector('[data-cv-fallback-or]').textContent = t.fallbackOr;
            backEl.textContent = t.back;
            loadingEl.textContent = t.loading;
            stageEl.classList.toggle('cv-stage--dark-doc', file.theme === 'dark');
            stageEl.classList.toggle('cv-stage--light-doc', file.theme === 'light');
            document.querySelectorAll('.cv-lang-btn').forEach(btn => {
                const active = btn.getAttribute('data-cv-lang') === currentLang;
                btn.classList.toggle('is-active', active);
                btn.setAttribute('aria-pressed', active ? 'true' : 'false');
            });
            const url = new URL(location.href);
            if (currentLang === 'en') url.searchParams.set('lang', 'en');
            else url.searchParams.delete('lang');
            history.replaceState({}, '', url.pathname + url.search);
            syncThemeMeta();
        }

        async function ensurePdfjs() {
            if (pdfjsLib) return pdfjsLib;
            pdfjsLib = await import(`${PDFJS_BASE}/build/pdf.min.mjs`);
            pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/build/pdf.worker.min.mjs`;
            return pdfjsLib;
        }

        async function renderPdf() {
            const token = ++renderToken;
            const file = currentPdf();

            stageEl.setAttribute('aria-busy', 'true');
            loadingEl.hidden = false;
            pagesEl.hidden = true;
            pagesEl.innerHTML = '';
            fallbackEl.hidden = true;

            try {
                const pdfjs = await ensurePdfjs();
                if (token !== renderToken) return;

                const doc = await pdfjs.getDocument({
                    url: file.url,
                    cMapUrl: `${PDFJS_BASE}/cmaps/`,
                    cMapPacked: true,
                    standardFontDataUrl: `${PDFJS_BASE}/standard_fonts/`,
                    useSystemFonts: true,
                    verbosity: 0
                }).promise;

                if (token !== renderToken) return;

                const stageWidth = stageEl.clientWidth || 800;
                const maxWidth = Math.max(280, Math.min(stageWidth - 32, 900));

                for (let n = 1; n <= doc.numPages; n++) {
                    if (token !== renderToken) return;
                    const page = await doc.getPage(n);
                    const base = page.getViewport({ scale: 1 });
                    const scale = Math.min(maxWidth / base.width, 2.4);
                    const viewport = page.getViewport({ scale });
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d', { alpha: false });
                    const outputScale = Math.min(window.devicePixelRatio || 1, 2);
                    canvas.width = Math.floor(viewport.width * outputScale);
                    canvas.height = Math.floor(viewport.height * outputScale);
                    canvas.style.width = `${Math.floor(viewport.width)}px`;
                    canvas.style.height = `${Math.floor(viewport.height)}px`;
                    canvas.className = 'cv-page-canvas';
                    canvas.setAttribute('aria-label', `${currentLang === 'en' ? 'Page' : 'Página'} ${n} / ${doc.numPages}`);
                    ctx.setTransform(outputScale, 0, 0, outputScale, 0, 0);
                    ctx.fillStyle = file.theme === 'dark' ? '#121212' : '#ffffff';
                    ctx.fillRect(0, 0, viewport.width, viewport.height);
                    await page.render({
                        canvasContext: ctx,
                        viewport,
                        intent: 'display'
                    }).promise;
                    if (token !== renderToken) return;
                    pagesEl.appendChild(canvas);
                }

                loadingEl.hidden = true;
                pagesEl.hidden = false;
                stageEl.setAttribute('aria-busy', 'false');
            } catch (err) {
                if (token !== renderToken) return;
                console.error('CV render failed', file.url, err);
                loadingEl.hidden = true;
                fallbackEl.hidden = false;
                stageEl.setAttribute('aria-busy', 'false');
            }
        }

        async function refresh() {
            setUi();
            await renderPdf();
        }

        document.querySelectorAll('.cv-lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.getAttribute('data-cv-lang');
                if (lang === currentLang) return;
                currentLang = lang;
                refresh();
            });
        });

        const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        syncThemeMeta();
        refresh();

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => renderPdf(), 280);
        });
    </script>
</body>
</html>
